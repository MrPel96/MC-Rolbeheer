<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f151c;
  --panel: #161f29;
  --panel-2: #1d2936;
  --line: #29394a;
  --line-soft: #1f2d3b;
  --text: #e8eff5;
  --muted: #8ba2b8;
  --accent: #2ed3e0;        /* cyaan */
  --accent-2: #3b8cff;      /* blauw */
  --accent-ink: #04222a;
  --ok: #4ade80;
  --warn: #f4bf5f;
  --deny: #f2706f;
  --radius-s: 6px;
  --radius-m: 10px;
  --radius-l: 14px;
  --ui: "Chivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --pixel: "Pixelify Sans", "Courier New", monospace;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px -18px rgba(0,0,0,.9);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background:
    radial-gradient(1100px 500px at 15% -10%, rgba(46,211,224,.08), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(59,140,255,.07), transparent 55%),
    var(--bg);
  color: var(--text);
  font: 15px/1.55 var(--ui);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
h1, h2, h3 { line-height: 1.2; }
code { background: #0008; padding: .08rem .35rem; border-radius: 4px; font-size: .88em; color: var(--accent); }
.icon { width: 1.05em; height: 1.05em; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- balk bovenaan ---------- */
.bar {
  display: flex; align-items: center; gap: 1rem; padding: .65rem 1.25rem;
  border-bottom: 1px solid var(--line); background: rgba(16,23,31,.9); backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 20;
}
.brand { font-family: var(--pixel); font-size: 1.3rem; font-weight: 600; letter-spacing: .02em; margin-right: .5rem; }
.brand span { color: var(--accent); }
.viewnav { display: flex; gap: .2rem; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: .2rem; }
.viewnav button {
  display: inline-flex; align-items: center; gap: .4rem; background: none; border: 0;
  border-radius: 999px; padding: .4rem .9rem; color: var(--muted); font-weight: 600; font-size: .92rem;
}
.viewnav button:hover { color: var(--text); }
.viewnav button[aria-current="true"] {
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink);
}
.bar-right { margin-left: auto; display: flex; align-items: center; gap: .7rem; }
.bar-info { color: var(--muted); font-size: .85rem; display: inline-flex; align-items: center; gap: .4rem; }
.pulse { width: .5rem; height: .5rem; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(74,222,128,.15); }

/* ---------- knoppen & velden ---------- */
.btn {
  display: inline-flex; align-items: center; gap: .4rem; white-space: nowrap;
  border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--radius-s);
  padding: .45rem .85rem; font-weight: 600; color: var(--text);
}
.btn:hover { border-color: var(--accent); color: var(--text); }
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent;
  color: var(--accent-ink);
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:disabled { opacity: .4; cursor: default; filter: none; }
.btn-danger { color: var(--deny); border-color: color-mix(in srgb, var(--deny) 40%, var(--line)); }
.btn-small { padding: .28rem .6rem; font-size: .85rem; }
.field { display: grid; gap: .35rem; }
.field label, .field > span:first-child { font-weight: 600; }
.hint { color: var(--muted); font-size: .86rem; max-width: 65ch; }
.input {
  width: 100%; background: #0e141b; border: 1px solid var(--line); border-radius: var(--radius-s);
  padding: .5rem .7rem; color: var(--text);
}
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(46,211,224,.12); }
select.input {
  appearance: none; padding-right: 2rem;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 1.05rem) 55%, calc(100% - .72rem) 55%;
  background-size: .34rem .34rem, .34rem .34rem; background-repeat: no-repeat;
}
.num { width: 7rem; }

/* ---------- schakelaars ---------- */
.switch { display: inline-flex; align-items: center; gap: .6rem; cursor: pointer; }
.switch input[type="checkbox"], .cmd-toggle input[type="checkbox"] {
  appearance: none; width: 2.7rem; height: 1.5rem; flex: none; border-radius: 999px;
  background: #0e141b; border: 1px solid var(--line); position: relative; cursor: pointer;
  transition: background .15s, border-color .15s;
}
.switch input[type="checkbox"]::after, .cmd-toggle input[type="checkbox"]::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 1.1rem; height: 1.1rem;
  border-radius: 50%; background: var(--muted); transition: left .15s, background .15s;
}
.switch input[type="checkbox"]:checked, .cmd-toggle input[type="checkbox"]:checked {
  background: color-mix(in srgb, var(--ok) 22%, transparent); border-color: var(--ok);
}
.switch input[type="checkbox"]:checked::after, .cmd-toggle input[type="checkbox"]:checked::after {
  left: calc(100% - 1.25rem); background: var(--ok);
}
.switch > span { font-weight: 600; min-width: 2.2rem; color: var(--muted); }
.switch input[type="checkbox"]:checked ~ span { color: var(--ok); }
.cmd-toggle { display: flex; align-items: center; gap: .45rem; cursor: pointer; }
.cmd-toggle input[type="checkbox"]:not(:checked) ~ code { color: var(--muted); text-decoration: line-through; }
input[type="checkbox"].plain { accent-color: var(--accent); width: 1.05rem; height: 1.05rem; }

/* ---------- indeling ---------- */
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 56px); }
.layout.server { grid-template-columns: minmax(0, 1fr); }
.layout.server .sidebar { display: none; }
.sidebar { border-right: 1px solid var(--line); padding: 1.1rem; display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
.sidebar h2 { font-size: .8rem; margin: 0; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.role-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.role-item {
  width: 100%; text-align: left; background: var(--panel); border: 1px solid transparent; border-radius: var(--radius-m);
  padding: .6rem .7rem; display: grid; grid-template-columns: 1fr auto; gap: .15rem .5rem;
}
.role-item:hover { border-color: var(--line); }
.role-item[aria-current="true"] { border-color: var(--accent); background: var(--panel-2); }
.role-item .rname { font-weight: 700; }
.role-item .rprefix { font-family: var(--pixel); font-size: .92rem; grid-column: 1 / -1; min-height: 1.2em; }
.role-item .rprio {
  color: var(--accent); font-size: .74rem; font-variant-numeric: tabular-nums; font-weight: 700;
  background: rgba(46,211,224,.1); border-radius: 999px; padding: .05rem .45rem; height: fit-content;
}
.new-role { display: flex; gap: .4rem; }
.new-role .input { min-width: 0; }
main { padding: 1.6rem 2rem 4rem; min-width: 0; }
.empty { color: var(--muted); padding: 3rem 0; }

/* ---------- koppen ---------- */
.page-head { margin-bottom: 1.4rem; }
.page-head h1 { margin: 0 0 .2rem; font-size: 1.7rem; }
.page-head p { margin: 0; color: var(--muted); }
.role-head { display: grid; gap: .8rem; margin-bottom: 1.4rem; }
.role-head h1 { margin: 0; font-size: 1.7rem; }
.role-meta { color: var(--muted); margin: 0; }
.chat {
  font-family: var(--pixel); font-size: 1.25rem; line-height: 1.6;
  background: #05080b; border: 1px solid var(--line); color: #fff; padding: .5rem .85rem;
  border-radius: var(--radius-m); text-shadow: 2px 2px 0 rgba(0,0,0,.6); max-width: 42rem; overflow-wrap: anywhere;
}
.chat .sep { color: #55606b; }
.chat-caption { color: var(--muted); font-size: .8rem; margin-top: -.4rem; }

/* ---------- tabs ---------- */
.tabs { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: 1.5rem; }
.tab {
  display: inline-flex; align-items: center; gap: .4rem;
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: .4rem .9rem; color: var(--muted); font-weight: 600; font-size: .92rem;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--accent); border-color: var(--accent); background: rgba(46,211,224,.08); }
.tab .count { font-size: .78rem; opacity: .8; }

/* ---------- kaarten & statistiek ---------- */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(9.5rem, 100%), 1fr)); gap: .8rem; margin-bottom: 1.4rem; }
.stat {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-m);
  padding: .85rem 1rem; display: grid; gap: .15rem; box-shadow: var(--shadow);
}
.stat .label { color: var(--muted); font-size: .8rem; display: inline-flex; align-items: center; gap: .35rem; }
.stat .big { font-family: var(--pixel); font-size: 1.85rem; line-height: 1.1; color: var(--accent); }
.stat .of { font-size: .95rem; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(21rem, 100%), 1fr)); gap: 1rem; align-items: start; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-l);
  padding: 1rem 1.1rem; box-shadow: var(--shadow);
}
.card > h2 { margin: 0 0 .6rem; font-size: 1rem; display: flex; align-items: center; gap: .45rem; }
.card > h2 .icon { color: var(--accent); }
.card .mini-list { border-top: 0; margin-top: 0; }
.card .mini-list li:last-child { border-bottom: 0; }
.card .btn { margin-top: .7rem; }

/* ---------- instellingen als raster ---------- */
.grid-settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(19rem, 100%), 1fr)); gap: .9rem; }
.setting-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-m);
  padding: .9rem 1rem; display: grid; gap: .55rem; box-shadow: var(--shadow);
}
.setting-card.on { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.setting-card .top { display: flex; align-items: flex-start; gap: .6rem; }
.setting-card .top .icon { color: var(--accent); margin-top: .15rem; }
.setting-card .name { font-weight: 700; }
.setting-card .sdesc { color: var(--muted); font-size: .85rem; }
.setting-card .control { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
.badge {
  display: inline-flex; align-items: center; gap: .25rem; font-size: .7rem; font-weight: 700;
  border: 1px solid var(--warn); color: var(--warn); border-radius: 999px; padding: .05rem .5rem;
  text-transform: uppercase; letter-spacing: .04em;
}
.badge.ok { border-color: var(--ok); color: var(--ok); }
.badge.off { border-color: var(--line); color: var(--muted); }

/* ---------- lijsten ---------- */
.mini-list { list-style: none; margin: .4rem 0 0; padding: 0; }
.mini-list li {
  display: flex; justify-content: space-between; align-items: center; gap: .75rem;
  padding: .5rem 0; border-bottom: 1px solid var(--line-soft);
}
.mini-list .detail { color: var(--muted); font-size: .82rem; }
.add-row { display: flex; gap: .4rem; margin-top: .6rem; flex-wrap: wrap; }
.add-row .input { min-width: 0; }
.list-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(17rem, 100%), 1fr)); gap: 1.2rem; }
.dot { display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: var(--line); margin-right: .5rem; }
.dot.on { background: var(--ok); }
.avatar {
  width: 1.7rem; height: 1.7rem; border-radius: 6px; display: inline-grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink);
  font-weight: 700; font-size: .8rem; margin-right: .55rem;
}
.warn {
  border-left: 3px solid var(--accent); background: var(--panel); padding: .7rem 1rem;
  border-radius: var(--radius-s); margin: 0 0 1.2rem; color: var(--muted);
}
.warn strong { color: var(--text); }

/* ---------- permissies ---------- */
.perm-layout { display: grid; grid-template-columns: 17rem minmax(0, 1fr); gap: 1.4rem; align-items: start; }
.group-list { display: grid; gap: 3px; position: sticky; top: 4.6rem; max-height: calc(100vh - 6rem); overflow: auto; padding-right: .2rem; }
.group-item {
  background: var(--panel); border: 1px solid transparent; border-radius: var(--radius-s); padding: .5rem .65rem;
  text-align: left; display: flex; justify-content: space-between; gap: .5rem; align-items: center;
}
.group-item:hover { border-color: var(--line); }
.group-item[aria-current="true"] { border-color: var(--accent); background: var(--panel-2); }
.group-item.off .gname { color: var(--muted); text-decoration: line-through; }
.gname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gcount { font-size: .75rem; white-space: nowrap; font-variant-numeric: tabular-nums; display: flex; gap: .3rem; }
.gcount .a { color: var(--ok); }
.gcount .d { color: var(--deny); }
.gcount .t { color: var(--muted); }
.perm-tools { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1rem; }
.perm-tools .input { max-width: 20rem; }
.check { display: inline-flex; gap: .4rem; align-items: center; color: var(--muted); }
.perm-rows { display: grid; gap: .5rem; }
.perm-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem; align-items: center;
  padding: .7rem .9rem; background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius-m);
}
.perm-row.is-allow { border-color: color-mix(in srgb, var(--ok) 45%, var(--line-soft)); }
.perm-row.is-deny { border-color: color-mix(in srgb, var(--deny) 45%, var(--line-soft)); }
.perm-title { font-weight: 700; overflow-wrap: anywhere; }
.perm-title.cmd { font-family: var(--pixel); font-weight: 600; font-size: 1.05rem; color: var(--accent); }
.perm-node { color: var(--muted); font-size: .8rem; overflow-wrap: anywhere; }
.perm-desc { font-size: .88rem; margin-top: .15rem; max-width: 62ch; color: var(--muted); }
.perm-note { font-size: .8rem; color: var(--warn); margin-top: .2rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: #0e141b; }
.seg button { background: none; border: 0; padding: .35rem .8rem; font-size: .85rem; color: var(--muted); font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"][data-s="ALLOW"] { background: var(--ok); color: #06240f; }
.seg button[aria-pressed="true"][data-s="DENY"] { background: var(--deny); color: #2c0606; }
.seg button[aria-pressed="true"][data-s="NONE"] { background: var(--panel-2); color: var(--text); }
.own-add { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
.own-add .input { max-width: 22rem; }
.tag-allow { color: var(--ok); font-weight: 700; }
.tag-deny { color: var(--deny); font-weight: 700; }

/* ---------- kleurkiezer & MOTD ---------- */
.motd-edit { display: grid; gap: .6rem; }
.motd-toolbar { display: flex; flex-wrap: wrap; gap: .3rem; align-items: center; }
.swatch { width: 1.6rem; height: 1.6rem; border-radius: 5px; border: 2px solid var(--line); padding: 0; }
.swatch[aria-pressed="true"] { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.swatch-none { background: repeating-linear-gradient(45deg, var(--panel-2) 0 5px, var(--bg) 5px 10px); }
.swatches { display: flex; flex-wrap: wrap; gap: .35rem; }
#motdText, #chatPrefix { font-family: var(--pixel); font-size: 1.05rem; resize: vertical; }
.motd-preview {
  font-family: var(--pixel); font-size: 1.2rem; line-height: 1.45;
  background: #05080b; border: 1px solid var(--line); border-radius: var(--radius-m);
  padding: .7rem 1rem; min-height: 3.4rem; text-shadow: 2px 2px 0 rgba(0,0,0,.7); overflow-wrap: anywhere;
}
.prio { display: flex; align-items: center; gap: .5rem; }
.prio .input { width: 5.5rem; text-align: center; }
.actions { display: flex; gap: .55rem; align-items: center; flex-wrap: wrap; }
.settings { display: grid; gap: 1.2rem; max-width: 38rem; }
.danger-zone { border-top: 1px solid var(--line); padding-top: 1.1rem; margin-top: .4rem; }
.setting-rows { display: grid; }
.setting-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem; align-items: center;
  padding: .8rem 0; border-bottom: 1px solid var(--line-soft);
}
.setting-row.wide { grid-template-columns: minmax(0, 1fr); }
.setting-row .slabel { font-weight: 600; }
.setting-row .sdesc { color: var(--muted); font-size: .86rem; max-width: 58ch; }
.cmd-toggles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(11rem, 100%), 1fr)); gap: .5rem .8rem; max-width: 52rem; }
details.advanced { margin-top: 1.2rem; border: 1px solid var(--line); border-radius: var(--radius-m); padding: .7rem .9rem; background: var(--panel); }
details.advanced summary { cursor: pointer; font-weight: 600; }
details.advanced[open] summary { margin-bottom: .8rem; }

/* ---------- melding ---------- */
.toast {
  position: fixed; bottom: 1.25rem; left: 50%; transform: translate(-50%, 1rem); opacity: 0;
  background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--ok);
  padding: .65rem 1.1rem; border-radius: var(--radius-s); pointer-events: none; z-index: 50;
  transition: opacity .2s, transform .2s; max-width: calc(100vw - 2rem); box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { border-left-color: var(--deny); }

@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
  .role-list { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; }
  .bar { padding: .6rem 1rem; flex-wrap: wrap; row-gap: .5rem; }
  .brand { font-size: 1.1rem; }
  .viewnav button { padding: .35rem .6rem; font-size: .85rem; }
  .viewnav button span { display: none; }
  .bar-right { margin-left: auto; }
  main { padding: 1.2rem 1rem 3rem; }
  .perm-layout { grid-template-columns: minmax(0, 1fr); }
  .group-list { position: static; max-height: 13rem; }
  .perm-row { grid-template-columns: minmax(0, 1fr); gap: .6rem; }
  .setting-row { grid-template-columns: minmax(0, 1fr); gap: .5rem; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<header class="bar">
  <div class="brand" id="brand">The <span>Blueprint</span></div>
  <nav class="viewnav" aria-label="Onderdelen">
    <button type="button" data-view="overview" aria-current="true"><span>Overzicht</span></button>
    <button type="button" data-view="roles" aria-current="false"><span>Rollen</span></button>
    <button type="button" data-view="server" aria-current="false"><span>Server</span></button>
  </nav>
  <div class="bar-right">
    <span class="bar-info" id="onlineInfo"><span class="pulse"></span></span>
    <button class="btn btn-small" id="scanBtn" type="button">Plugins scannen</button>
  </div>
</header>

<div class="layout" id="layout">
  <aside class="sidebar">
    <h2 id="rolesHeading">Rollen</h2>
    <ul class="role-list" id="roleList" aria-labelledby="rolesHeading"></ul>
    <form class="new-role" id="newRoleForm">
      <label class="sr-only" for="newRoleName">Naam van nieuwe rol</label>
      <input class="input" id="newRoleName" placeholder="naam nieuwe rol" autocomplete="off"
             pattern="[a-z0-9_\-]{1,32}" title="Alleen a-z, 0-9, _ en -" required>
      <button class="btn btn-primary" type="submit">Maken</button>
    </form>
  </aside>

  <main id="main"><p class="empty">Laden…</p></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/** Kleine iconenset (inline SVG, kleurt mee met de tekst). */
const svg = (d) => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICON = {
  grid: svg('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),
  users: svg('<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5"/><path d="M16 5.5a3 3 0 0 1 0 5.5M17 15c2.4.5 4 2.2 4 5"/>'),

// Minecraft-kleurcodes: code -> [kleur, naam]
const MC_CODES = [
  ["0", "#000000", "black"], ["1", "#0000AA", "dark blue"], ["2", "#00AA00", "dark green"],
  ["3", "#00AAAA", "dark aqua"], ["4", "#AA0000", "dark red"], ["5", "#AA00AA", "dark purple"],
  ["6", "#FFAA00", "gold"], ["7", "#AAAAAA", "gray"], ["8", "#555555", "dark gray"],
  ["9", "#5555FF", "blue"], ["a", "#55FF55", "green"], ["b", "#55FFFF", "aqua"],
  ["c", "#FF5555", "red"], ["d", "#FF55FF", "light purple"], ["e", "#FFFF55", "yellow"],
  ["f", "#FFFFFF", "white"]
];

/** Tekst met &-codes omzetten naar gekleurde HTML, zoals Minecraft het toont. */
function mcHtml(text) {
  const colors = Object.fromEntries(MC_CODES.map(([c, hex]) => [c, hex]));
  let out = "", style = { color: "#AAAAAA", bold: false, italic: false, under: false, strike: false };
  const open = () => {
    const d = [style.under ? "underline" : "", style.strike ? "line-through" : ""].filter(Boolean).join(" ");
    return `<span style="color:${style.color};${style.bold ? "font-weight:700;" : ""}` +
      `${style.italic ? "font-style:italic;" : ""}${d ? `text-decoration:${d};` : ""}">`;
  };
  out += open();
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if ((ch === "&" || ch === "\u00a7") && i + 1 < text.length) {
      const code = text[i + 1].toLowerCase();
      if (colors[code]) { style = { color: colors[code], bold: false, italic: false, under: false, strike: false }; }
      else if (code === "l") style.bold = true;
      else if (code === "o") style.italic = true;
      else if (code === "n") style.under = true;
      else if (code === "m") style.strike = true;
      else if (code === "r") style = { color: "#AAAAAA", bold: false, italic: false, under: false, strike: false };
      else { out += esc(ch); continue; }
      i++;
      out += "</span>" + open();
      continue;
    }
    if (ch === "\n") { out += "</span><br>" + open(); continue; }
    out += esc(ch);
  }
  return out + "</span>";
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ------------------------------------------------------------------ server

async function api(path, body) {
  const opt = body === undefined ? {} : {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-RolBeheer": "1" },
    body: JSON.stringify(body)
  };
  let res;
  try {
    res = await fetch("/api/" + path, opt);
  } catch {
    throw new Error("Geen verbinding met de server. Draait Minecraft nog?");
  }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) {
    document.body.innerHTML = '<main style="padding:3rem;max-width:30rem"><h1>Je bent uitgelogd</h1>' +
      '<p>Typ <code>/rol web</code> in de game voor een nieuwe inloglink.</p></main>';
    throw new Error("uitgelogd");
  }
  if (!res.ok) throw new Error(data.error || "Er ging iets mis.");
  return data;
}

async function change(path, body, okText) {
  // Focus onthouden zodat toetsenbordgebruikers niet hun plek kwijtraken
  const a = document.activeElement;
  const keep = a && a.dataset && a.dataset.node ? `[data-node="${CSS.escape(a.dataset.node)}"][data-s="${a.dataset.s}"]` : null;
  try {
    S.state = await api(path, body);
    renderAll();
    if (keep) $(keep)?.focus({ preventScroll: true });
    if (okText) toast(okText);
    return true;
  } catch (e) {
    if (e.message !== "uitgelogd") toast(e.message, true);
    return false;
  }
}

let toastTimer;
function toast(text, error = false) {
  const t = $("#toast");
  t.textContent = text;
  t.classList.toggle("err", error);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), error ? 5000 : 2200);
}

const currentRole = () => S.state?.roles.find(r => r.name === S.role) || null;

function permState(role, node) {
  if (role.permissions.includes(node)) return "ALLOW";
  if (role.permissions.includes("-" + node)) return "DENY";
  return "NONE";
}

/** Valt deze permissie onder een wildcard van de rol? */
function wildcardHit(role, node) {
  let hit = null;
  for (const raw of role.permissions) {
    const deny = raw.startsWith("-");
    const p = deny ? raw.slice(1) : raw;
    if (p === "*" || (p.endsWith(".*") && node.startsWith(p.slice(0, -1)) && node !== p)) {
      hit = { wildcard: p, deny };
    }
  }
  return hit;
}

function groupCounts(role, group) {
  let a = 0, d = 0;
  for (const e of group.entries) {
    const s = permState(role, e.node);
    if (s === "ALLOW") a++; else if (s === "DENY") d++;
  }
  return { a, d };
}

/** Laat de server het voorbeeld maken, zodat ook gradients kloppen. */
function previewMotd(value) {
  clearTimeout(motdTimer);
  motdTimer = setTimeout(async () => {
    try {
      const parts = await Promise.all(value.split("\n").slice(0, 2).map(line => api("preview", { text: line })));
      const box = $("#motdPreview");
      if (box) box.innerHTML = parts.map(h => h.html || "&nbsp;").join("<br>");
    } catch { /* voorbeeld is niet kritisch */ }
  }, 250);
}

function propControl(p) {
  if (p.type === "BOOL") {
    const on = p.value === "true";
    return `<label class="switch"><input type="checkbox" data-prop="${p.key}" ${on ? "checked" : ""}>
      <span>${on ? "Aan" : "Uit"}</span></label>`;
  }
  if (p.type === "CHOICE") {
    return `<select class="input" data-prop="${p.key}">${p.options.map(o =>
      `<option value="${o}" ${o === p.value ? "selected" : ""}>${esc(CHOICE_LABELS[o] || o)}</option>`).join("")}</select>`;
  }
  if (p.type === "NUMBER") {
    return `<input class="input num" type="number" min="${p.min}" max="${p.max}" value="${esc(p.value)}" data-prop="${p.key}">`;
  }
  return `<input class="input" value="${esc(p.value)}" data-prop="${p.key}">`;
}

async function loadBerichten(body, okText) {
  try {
    S.berichten = body ? await api(body.path, body.data) : await api("berichten");

function resetForm(role) {
  S.form = { name: role.name, prefix: role.prefix, suffix: role.suffix, priority: role.priority, nameColor: role.nameColor };
  S.previewPrefix = role.prefixHtml;
  S.previewSuffix = role.suffixHtml;
}

function formDirty(role) {
  const f = S.form;
  return f.prefix !== role.prefix || f.suffix !== role.suffix
    || Number(f.priority) !== role.priority || f.nameColor !== role.nameColor;
}

}

let previewTimer;
function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    try {
      const [p, s] = await Promise.all([
        api("preview", { text: S.form.prefix }), api("preview", { text: S.form.suffix })
      ]);
      S.previewPrefix = p.html;
      S.previewSuffix = s.html;
      updateChatPreview();
    } catch { /* voorbeeld is niet kritisch */ }
  }, 250);
}

function refreshSaveState() {
  const role = currentRole();
  const dirty = formDirty(role);
  $("#saveBtn").disabled = !dirty;
  $("#undoBtn").hidden = !dirty;
}

// ---------- permissies

function renderPerms(role) {
  const groups = S.plugins?.groups ?? [];
  const filter = S.groupFilter.toLowerCase();
  const own = role.permissions.length;
  const list = [`<button class="group-item" type="button" data-group="${OWN}" aria-current="${S.group === OWN}">
      <span class="gname">${ICON.key} Eigen permissies</span><span class="gcount"><span class="t">${own}</span></span></button>`]
    .concat(groups.filter(g => !filter || g.name.toLowerCase().includes(filter)).map(g => {
      const { a, d } = groupCounts(role, g);
      const counts = (a || d)
        ? `${a ? `<span class="a">${a} ✔</span>` : ""} ${d ? `<span class="d">${d} ✖</span>` : ""}`
        : `<span class="t">${g.entries.length}</span>`;
      return `<button class="group-item${g.enabled ? "" : " off"}" type="button" data-group="${esc(g.name)}"
          aria-current="${S.group === g.name}" title="${g.enabled ? "" : "Deze plugin staat uit"}">
        <span class="gname">${esc(g.name)}</span><span class="gcount">${counts}</span></button>`;
    })).join("");

  $("#tabBody").innerHTML = `
    <div class="perm-layout">
      <div>
        <label class="sr-only" for="groupFilter">Plugins filteren</label>
        <input class="input" id="groupFilter" placeholder="Plugin zoeken" value="${esc(S.groupFilter)}" style="margin-bottom:.6rem">
        <nav class="group-list" aria-label="Plugins">${list}</nav>
      </div>
      <div id="permPane"></div>
    </div>`;
  renderPermPane(role);
}

function visibleEntries(group) {
  const q = S.search.toLowerCase();
  return group.entries.filter(e =>
    (!S.onlyCmd || e.commands.length) &&
    (!q || e.node.includes(q) || e.description.toLowerCase().includes(q) || e.commands.some(c => c.includes(q))));
}

function renderPermPane(role) {
  const pane = $("#permPane");
  if (S.group === OWN) {
    const rows = role.permissions.map(p => {
      const deny = p.startsWith("-");
      const node = deny ? p.slice(1) : p;
      return `<div class="perm-row">
        <div><div class="perm-title">${esc(node)}</div>
          <div class="perm-node"><span class="${deny ? "tag-deny" : "tag-allow"}">${deny ? "Verboden" : "Toegestaan"}</span></div></div>
        <button class="btn btn-small" type="button" data-remove="${esc(node)}">Verwijderen</button></div>`;
    }).join("");
    pane.innerHTML = `
      <h2 style="margin:0 0 .3rem;font-size:1.15rem">Eigen permissies</h2>
      <p class="hint" style="margin:0 0 1rem">Alles wat deze rol heeft ingesteld, ook wildcards.
        <code>*</code> geeft alles, <code>essentials.*</code> alles van één plugin.</p>
      <form class="own-add" id="ownAdd">
        <label class="sr-only" for="ownNode">Permissie</label>
        <input class="input" id="ownNode" placeholder="bijv. essentials.fly" autocomplete="off" required list="nodeList">
        <button class="btn btn-primary" type="submit" data-state="ALLOW">Toestaan</button>
        <button class="btn" type="submit" data-state="DENY">Verbieden</button>
      </form>
      <datalist id="nodeList">${(S.plugins?.groups ?? []).flatMap(g => g.entries).slice(0, 3000)
        .map(e => `<option value="${esc(e.node)}">`).join("")}</datalist>
      <div class="perm-rows">${rows || '<p class="empty" style="padding:1.5rem 0">Deze rol heeft nog geen permissies. Kies links een plugin of voeg er hierboven een toe.</p>'}</div>`;
    return;
  }

  const group = S.plugins?.groups.find(g => g.name === S.group);
  if (!group) { S.group = OWN; renderPermPane(role); return; }
  const entries = visibleEntries(group);

  const rows = entries.map(e => {
    const st = permState(role, e.node);
    const hit = st === "NONE" ? wildcardHit(role, e.node) : null;
    const title = e.commands.length
      ? `<div class="perm-title cmd">${e.commands.map(esc).join(", ")}</div><div class="perm-node">${esc(e.node)}</div>`
      : `<div class="perm-title">${esc(e.node)}</div>`;
    const desc = e.virtual
      ? `<div class="perm-desc">Dit command heeft geen eigen permissie, dus iedereen mag het standaard. Zet het op Verboden om het te blokkeren.</div>`
      : (e.description ? `<div class="perm-desc">${esc(e.description)}</div>` : "");
    const note = hit ? `<div class="perm-note">Via <code>${esc(hit.wildcard)}</code>: ${hit.deny ? "verboden" : "toegestaan"}</div>` : "";
    return `<div class="perm-row ${st === "ALLOW" ? "is-allow" : st === "DENY" ? "is-deny" : ""}">
      <div>${title}${desc}${note}</div>
      <div class="seg" role="group" aria-label="Status van ${esc(e.node)}">
        ${["ALLOW", "NONE", "DENY"].map(s => `<button type="button" data-node="${esc(e.node)}" data-s="${s}"
          aria-pressed="${st === s}">${{ ALLOW: "Toegestaan", NONE: "Niet ingesteld", DENY: "Verboden" }[s]}</button>`).join("")}
      </div></div>`;
  }).join("");

  pane.innerHTML = `
    <h2 style="margin:0 0 .3rem;font-size:1.15rem">${esc(group.name)}${group.enabled ? "" : ' <span class="hint">(staat uit)</span>'}</h2>
    <p class="hint" style="margin:0 0 1rem">Niet ingesteld betekent: de standaard van de plugin. Dat is meestal alleen voor OP.</p>
    <div class="perm-tools">
      <label class="sr-only" for="permSearch">Zoeken</label>
      <input class="input" id="permSearch" placeholder="Zoek permissie of command" value="${esc(S.search)}">
      <label class="check"><input type="checkbox" class="plain" id="onlyCmd" ${S.onlyCmd ? "checked" : ""}> Alleen commands</label>
    </div>
    <div class="perm-tools">
      <span class="hint">${entries.length} zichtbaar:</span>
      <button class="btn btn-small" type="button" data-bulk="ALLOW">Alles toestaan</button>
      <button class="btn btn-small" type="button" data-bulk="DENY">Alles verbieden</button>
      <button class="btn btn-small" type="button" data-bulk="NONE">Alles resetten</button>
    </div>
    <div class="perm-rows">${rows || '<p class="empty" style="padding:1.5rem 0">Niets gevonden. Pas je zoekopdracht aan.</p>'}</div>`;
}

// ---------- spelers

function renderPlayers(role) {
  if (role.isDefault) {
    $("#tabBody").innerHTML = '<p class="empty">Iedere speler heeft deze rol automatisch. Geef extra rollen via een andere rol.</p>';
    return;
  }
  const members = [...role.members].sort((a, b) => (b.online - a.online) || a.name.localeCompare(b.name));
  const suggestions = S.state.online.filter(n => !role.members.some(m => m.name === n));
  $("#tabBody").innerHTML = `
    <form class="player-add" id="playerAdd">
      <label class="sr-only" for="playerName">Spelernaam</label>
      <input class="input" id="playerName" placeholder="Spelernaam" list="onlineList" autocomplete="off" required>
      <button class="btn btn-primary" type="submit">Rol geven</button>
    </form>
    <datalist id="onlineList">${suggestions.map(n => `<option value="${esc(n)}">`).join("")}</datalist>
    <p class="hint">Spelers die nu online zijn verschijnen als suggestie. Offline spelers kun je toevoegen als ze al eens op de server zijn geweest.</p>
    <ul class="player-list">${members.map(m => `
      <li><span><span class="dot${m.online ? " on" : ""}" title="${m.online ? "Online" : "Offline"}"></span>${esc(m.name)}</span>
        <button class="btn btn-small" type="button" data-kick="${esc(m.name)}">Rol afpakken</button></li>`).join("")
      || '<li class="hint">Nog niemand heeft deze rol.</li>'}</ul>`;
}

// ------------------------------------------------------------------ events

// ------------------------------------------------------------------ events

document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("button");
  if (!t) return;
  const role = currentRole();

  if (t.dataset.view) {
    if (t.dataset.view === "server") await openServer();
    else if (t.dataset.view === "overview") await openOverview();
    else { S.view = "roles"; renderAll(); }
    return;
  }
  if (t.dataset.goto) {
    if (t.dataset.goto === "roles") { S.view = "roles"; renderAll(); }
    else { S.serverTab = t.dataset.goto; await openServer(); }
    return;
  }
  if (t.dataset.stab) { S.serverTab = t.dataset.stab; renderServer(); return; }
  if (t.dataset.ins !== undefined && t.dataset.insFor) {
    const box = document.getElementById(t.dataset.insFor);
    const code = t.dataset.ins;
    const start = box.selectionStart ?? box.value.length;
    box.value = box.value.slice(0, start) + code + box.value.slice(box.selectionEnd ?? start);
    box.focus();
    box.setSelectionRange(start + code.length, start + code.length);
    box.dispatchEvent(new Event("input", { bubbles: true }));
    return;
  }
  if (t.dataset.grad !== undefined) {
    const g = GRADIENTS[Number(t.dataset.grad)];
    const box = $("#motdText");
    if (box) {
      const start = box.selectionStart ?? box.value.length;
      box.value = box.value.slice(0, start) + `<gradient:${g.from}:${g.to}>` + box.value.slice(box.selectionEnd ?? start);
      box.focus();
      box.dispatchEvent(new Event("input", { bubbles: true }));
    }
    return;
  }
  if (t.dataset.msgSave) {
    const map = { bJoin: "join", bVertrek: "vertrek", bEerste: "eerste-join", bWelkom: "welkom",
      bKop: "koptekst", bVoet: "voettekst", bTitel: "scorebord-titel" };
    const key = map[t.dataset.msgSave];
    await loadBerichten({ path: "berichten/opslaan", data: { key, value: $("#" + t.dataset.msgSave).value } });
    return;
  }
  if (t.id === "resetStats") {
    if (confirm("Alle doden en kills op nul zetten? Dit kun je niet terugdraaien.")) {
      await loadBerichten({ path: "stats/reset", data: {} });
    }
    return;
  }
  if (t.id === "saveChatPrefix") {
    await loadSpelers("spelers/instelling", { key: "chat-prefix", value: $("#chatPrefix").value });
    return;
  }
  if (t.id === "saveMotd") {
    await serverChange("server/motd", { value: $("#motdText").value }, "MOTD opgeslagen.");
    return;
  }
  if (t.id === "importEss") {
    if (confirm("Homes uit EssentialsX overnemen? Bestaande homes in The Blueprint blijven staan.")) {
      t.disabled = true;
      t.textContent = "Bezig…";
      await loadSpelers("spelers/import", { overwrite: false });
    }
    return;
  }
  if (t.dataset.warpDel) {
    if (confirm(`Warp ${t.dataset.warpDel} verwijderen?`)) await loadSpelers("spelers/warp", { name: t.dataset.warpDel });
    return;
  }
  if (t.dataset.kitDel) {
    if (confirm(`Kit ${t.dataset.kitDel} verwijderen?`)) {
      await loadSpelers("spelers/kit", { name: t.dataset.kitDel, delete: true });
    }
    return;
  }
  if (t.dataset.access) {
    const player = t.dataset.player;
    const action = t.dataset.access;
    if (action === "ban" || action === "kick" || action === "deop") {
      const vraag = { ban: `${player} verbannen?`, kick: `${player} van de server halen?`,
        deop: `${player} geen operator meer maken?` }[action];
      if (!confirm(vraag)) return;
    }
    await serverChange("server/player", { action, player });
    return;
  }

  if (t.dataset.role) {
    S.role = t.dataset.role; S.form = null; S.search = "";
    renderAll();
  } else if (t.dataset.tab) {
    S.tab = t.dataset.tab; renderMain();
  } else if (t.id === "scanBtn") {
    t.disabled = true;
    try {
      S.state = await api("rescan", {});
      S.plugins = await api("plugins");
      renderAll();
      toast(`${S.plugins.groups.length} plugins gevonden.`);
    } catch (e) { if (e.message !== "uitgelogd") toast(e.message, true); }
    t.disabled = false;
  } else if (t.dataset.color !== undefined && t.classList.contains("swatch")) {
    S.form.nameColor = t.dataset.color;
    document.querySelectorAll(".swatch").forEach(b => b.setAttribute("aria-pressed", b === t));
    updateChatPreview(); refreshSaveState();
  } else if (t.dataset.prio) {
    const input = $("#fPrio");
    input.value = Math.max(0, Math.min(999, Number(input.value || 0) + Number(t.dataset.prio)));
    S.form.priority = Number(input.value); refreshSaveState();
  } else if (t.id === "undoBtn") {
    resetForm(role); renderMain();
  } else if (t.id === "deleteBtn") {
    if (confirm(`Rol "${role.name}" verwijderen? Spelers met deze rol verliezen hem.`)) {
      await change("role/delete", { name: role.name }, `Rol ${role.name} verwijderd.`);
    }
  } else if (t.dataset.group) {
    S.group = t.dataset.group; S.search = ""; renderPerms(role);
  } else if (t.dataset.node && t.dataset.s) {
    if (t.getAttribute("aria-pressed") === "true") return;
    await change("role/perm", { role: role.name, node: t.dataset.node, state: t.dataset.s });
  } else if (t.dataset.bulk) {
    const group = S.plugins.groups.find(g => g.name === S.group);
    const nodes = visibleEntries(group).map(e => e.node);
    const label = { ALLOW: "toestaan", DENY: "verbieden", NONE: "resetten" }[t.dataset.bulk];
    if (nodes.length && confirm(`${nodes.length} permissies ${label} voor ${role.name}?`)) {
      await change("role/perms", { role: role.name, nodes, state: t.dataset.bulk }, `${nodes.length} permissies bijgewerkt.`);
    }
  } else if (t.dataset.remove) {
    await change("role/perm", { role: role.name, node: t.dataset.remove, state: "NONE" }, "Permissie verwijderd.");
  } else if (t.dataset.kick) {
    await change("player/role", { role: role.name, player: t.dataset.kick, action: "remove" },
      `${t.dataset.kick} heeft de rol ${role.name} niet meer.`);
  }
});

document.addEventListener("change", async (ev) => {
  const t = ev.target;
  if (t.dataset.prop) {
    const value = t.type === "checkbox" ? String(t.checked) : t.value;
    await serverChange("server/property", { key: t.dataset.prop, value });
  } else if (t.dataset.rule) {
    const value = t.type === "checkbox" ? String(t.checked) : t.value;
    await serverChange("server/gamerule", { world: S.server.world, key: t.dataset.rule, value });
  } else if (t.dataset.module) {
    await loadSpelers("spelers/module", { name: t.dataset.module, enabled: t.checked });
  } else if (t.dataset.sp) {
    const value = t.type === "checkbox" ? t.checked : Number(t.value);
    await loadSpelers("spelers/instelling", { key: t.dataset.sp, value });
  } else if (t.dataset.cmd) {
    await loadSpelers("spelers/commando", { name: t.dataset.cmd, enabled: t.checked });
  } else if (t.dataset.msgToggle) {
    await loadBerichten({ path: "berichten/opslaan", data: { key: t.dataset.msgToggle, value: t.checked } });
  } else if (t.dataset.msgSelect) {
    await loadBerichten({ path: "berichten/opslaan", data: { key: t.dataset.msgSelect, value: t.value } });
  } else if (t.dataset.msgNumber) {
    await loadBerichten({ path: "berichten/opslaan", data: { key: t.dataset.msgNumber, value: Number(t.value) } });
  } else if (t.dataset.kitCd) {
    await loadSpelers("spelers/kit", { name: t.dataset.kitCd, value: Number(t.value) });
  } else if (t.id === "wlToggle") {
    await serverChange("server/whitelist", { on: t.checked });
  } else if (t.id === "worldPick") {
    try { S.server = await api("server/world", { world: t.value }); renderServer(); }
    catch (e) { if (e.message !== "uitgelogd") toast(e.message, true); }
  }
});

document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "fPrefix") { S.form.prefix = t.value; schedulePreview(); refreshSaveState(); }
  else if (t.id === "fSuffix") { S.form.suffix = t.value; schedulePreview(); refreshSaveState(); }
  else if (t.id === "fPrio") { S.form.priority = Number(t.value || 0); refreshSaveState(); }
  else if (t.id === "permSearch") {
    S.search = t.value;
    const pos = t.selectionStart;
    renderPermPane(currentRole());
    const again = $("#permSearch"); again.focus(); again.setSelectionRange(pos, pos);
  } else if (t.id === "groupFilter") {
    S.groupFilter = t.value;
    const pos = t.selectionStart;
    renderPerms(currentRole());
    const again = $("#groupFilter"); again.focus(); again.setSelectionRange(pos, pos);
  } else if (t.id === "chatPrefix") {
    $("#chatPrefixPreview").innerHTML = mcHtml(t.value) + ' <span style="color:#AAAAAA">Home opgeslagen.</span>';
  } else if (t.id === "motdText") {
    previewMotd(t.value);
  } else if (t.id === "onlyCmd") {
    S.onlyCmd = t.checked; renderPermPane(currentRole());
  }
});

document.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  const role = currentRole();

  if (f.id === "newRoleForm") {
    const input = $("#newRoleName");
    const name = input.value.trim().toLowerCase();
    if (await change("role/create", { name }, `Rol ${name} aangemaakt.`)) {
      input.value = ""; S.role = name; S.form = null; S.tab = "settings"; renderAll();
    }
  } else if (f.id === "settingsForm") {
    const ok = await change("role/update", {
      name: role.name, prefix: S.form.prefix, suffix: S.form.suffix,
      priority: Number(S.form.priority), nameColor: S.form.nameColor
    }, "Wijzigingen opgeslagen.");
    if (ok) { resetForm(currentRole()); renderMain(); }
  } else if (f.id === "ownAdd") {
    const node = $("#ownNode").value.trim().toLowerCase().replace(/^-/, "");
    const state = ev.submitter?.dataset.state || "ALLOW";
    if (node) await change("role/perm", { role: role.name, node, state },
      state === "ALLOW" ? `${node} toegestaan.` : `${node} verboden.`);
  } else if (f.dataset.add) {
    const input = f.querySelector("input");
    const player = input.value.trim();
    if (!player) return;
    if (f.dataset.add === "ban" && !confirm(`${player} verbannen?`)) return;
    await serverChange("server/player", { action: f.dataset.add, player });
    input.value = "";
  } else if (f.id === "playerAdd") {
    const player = $("#playerName").value.trim();
    await change("player/role", { role: role.name, player, action: "add" }, `${player} heeft nu de rol ${role.name}.`);
  }
});

// Spelers online/offline bijwerken als je terugkomt naar het tabblad
window.addEventListener("focus", async () => {
  try {
    S.state = await api("state");
    renderRoleList();
    if (S.tab === "players") renderMain();
  } catch { /* stil */ }
});

function paintHeaderIcons() {
  document.querySelectorAll(".viewnav button").forEach(b => {
    const key = { overview: "grid", roles: "users", server: "server" }[b.dataset.view];
    if (key && !b.querySelector("svg")) b.insertAdjacentHTML("afterbegin", ICON[key]);
  });
}

(async function init() {
  paintHeaderIcons();
  try {
    [S.state, S.plugins, S.overview] = await Promise.all([api("state"), api("plugins"), api("overzicht")]);
    renderAll();
  } catch (e) {
    if (e.message !== "uitgelogd") $("#main").innerHTML = `<p class="empty">${esc(e.message)}</p>`;
  }
})();
</script>
</body>

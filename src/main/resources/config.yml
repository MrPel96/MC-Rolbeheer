# ------------------------------------------------------------
#  RolBeheer - instellingen
#  Rollen zelf staan in roles.yml, spelers in players.yml.
#  Na handmatig bewerken: /rol herlaad
# ------------------------------------------------------------

# Deze rol heeft iedere speler automatisch.
standaard-rol: speler

chat:
  # Zet op false als een andere plugin (bijv. EssentialsChat) de chat al opmaakt.
  ingeschakeld: true
  # Beschikbaar: <prefix> <naam> <suffix> <bericht>  (MiniMessage-opmaak)
  formaat: "<prefix><naam><suffix><dark_gray> » </dark_gray><white><bericht>"

tablijst:
  # Prefix en suffix tonen in de tablijst (TAB).
  ingeschakeld: true

naamlabel:
  # Prefix en suffix tonen boven het hoofd van spelers.
  ingeschakeld: true

berichten:
  geen-toegang-command: "<red>Je hebt geen toestemming om dit command te gebruiken."

commands:
  # Spelerscommands van RolBeheer zelf: /home, /spawn, /warp, /kit, /tpa, /msg en /back.
  # Zet dit op false als een andere plugin (bijv. EssentialsX) die commands al levert.
  ingeschakeld: true
  # Hoeveel homes een speler standaard mag. Meer geef je per rol met rolbeheer.homes.<getal>.
  standaard-homes: 1
  # Hoe lang een teleportverzoek geldig blijft, in seconden.
  tpa-seconden: 60
  spawn:
    # Nieuwe spelers beginnen op het spawnpunt dat je met /setspawn hebt gezet.
    bij-eerste-join: true
    # Na de dood terug naar het spawnpunt, tenzij de speler een bed of respawn anchor heeft.
    bij-dood: true
    bescherming:
      # Beschermt het gebied rond je spawnpunt. Wie rolbeheer.spawnbescherming.bypass heeft, mag alles.
      ingeschakeld: false
      # Straal in blokken rond het spawnpunt.
      straal: 32
      geen-pvp: true
      geen-mobschade: true
      # Ook kisten, deuren en knoppen op slot zetten.
      geen-interactie: false
  # Commands die je liever door een andere plugin laat doen. Vraagt om een herstart.
  # Bijvoorbeeld: [warp, warps, setwarp, delwarp]
  uitgeschakeld: []

web:
  # Webpaneel voor het beheren van rollen in je browser. Inloggen: /rol web
  ingeschakeld: true
  # 127.0.0.1 = alleen bereikbaar op de computer waar de server draait (veiligst).
  # 0.0.0.0   = ook bereikbaar vanaf andere apparaten, bijv. als je server bij een host draait.
  #             De poort moet dan open staan in je firewall/bij je host.
  adres: 127.0.0.1
  poort: 8765
  # Adres dat in de inloglink komt. Bij een host: het IP-adres of de domeinnaam van je server.
  publiek-adres: localhost

updates:
  # Waar de plugin naar nieuwe versies zoekt. Vul je GitHub-repository in, bijv. jouwnaam/rolbeheer.
  repo: ""
  # Alleen nodig bij een privé-repository: een GitHub-token met leesrechten op Contents.
  # Maak er een aan via github.com > Settings > Developer settings > Personal access tokens.
  token: ""

name: Build The Blueprint
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: TheBlueprint
          path: target/TheBlueprint-*.jar
      - name: Release maken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          gh release delete "v$VERSION" -y --cleanup-tag || true
          gh release create "v$VERSION" target/TheBlueprint-$VERSION.jar \
            --title "The Blueprint $VERSION" --notes "Automatisch gebouwd vanaf $GITHUB_SHA"
